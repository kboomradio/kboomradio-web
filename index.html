<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K-Boom Radio | En Directo</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación para el ecualizador */
        @keyframes bounce-bar {
            0%, 100% { height: 6px; }
            50% { height: 28px; }
        }
        .animate-bar-1 { animation: bounce-bar 0.8s infinite ease-in-out; }
        .animate-bar-2 { animation: bounce-bar 1.1s infinite ease-in-out 0.2s; }
        .animate-bar-3 { animation: bounce-bar 0.7s infinite ease-in-out 0.4s; }
        .animate-bar-4 { animation: bounce-bar 0.9s infinite ease-in-out 0.1s; }
    </style>
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-4 font-sans text-slate-800">

    <main class="w-full max-w-md flex flex-col items-center text-center space-y-8">
        
        <!-- Logo de K-Boom Radio -->
        <div class="w-full max-w-xs flex justify-center">
            <img 
                src="LOGOKBOOMRADIO.jpg" 
                alt="K-Boom Radio Logo" 
                class="w-full h-auto object-contain drop-shadow-sm"
                id="radio-logo"
            >
        </div>

        <!-- Reproductor / Botón de Play -->
        <div class="flex flex-col items-center space-y-6 w-full">
            
            <!-- Botón Principal -->
            <button 
                id="play-btn" 
                aria-label="Reproducir emisión"
                class="w-24 h-24 rounded-full bg-[#0047AB] hover:bg-[#003380] text-white flex items-center justify-center shadow-lg transition-all transform active:scale-95 focus:outline-none focus:ring-4 focus:ring-blue-300"
            >
                <!-- Icono Play -->
                <svg id="play-icon" class="w-10 h-10 ml-1 fill-current" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <!-- Icono Pause (Oculto por defecto) -->
                <svg id="pause-icon" class="w-10 h-10 hidden fill-current" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- Ecualizador Animado (Oculto mientras está en pausa) -->
            <div id="equalizer" class="flex items-end space-x-1.5 h-8 opacity-0 transition-opacity duration-300">
                <div class="w-1.5 bg-[#0047AB] rounded-full animate-bar-1"></div>
                <div class="w-1.5 bg-[#0047AB] rounded-full animate-bar-2"></div>
                <div class="w-1.5 bg-[#0047AB] rounded-full animate-bar-3"></div>
                <div class="w-1.5 bg-[#0047AB] rounded-full animate-bar-4"></div>
            </div>

            <!-- Control de Volumen Sutil -->
            <div class="flex items-center space-x-3 w-48 text-slate-400 pt-2">
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3z"/>
                </svg>
                <input 
                    type="range" 
                    id="volume-slider" 
                    min="0" 
                    max="1" 
                    step="0.01" 
                    value="0.8"
                    class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-[#0047AB]"
                >
                <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
                </svg>
            </div>

        </div>

    </main>

    <!-- Elemento de Audio de la Emisora -->
    <audio id="audio-player" preload="none">
        <!-- Reemplazar esta URL con la señal en directo de AzuraCast mañana -->
        <source src="https://k-boomradio.com/listen/k-boom/radio.mp3" type="audio/mpeg">
    </audio>

    <script>
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const pauseIcon = document.getElementById('pause-icon');
        const audioPlayer = document.getElementById('audio-player');
        const equalizer = document.getElementById('equalizer');
        const volumeSlider = document.getElementById('volume-slider');

        let isPlaying = false;

        // Alternar Play/Pausa
        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                audioPlayer.play().then(() => {
                    isPlaying = true;
                    playIcon.classList.add('hidden');
                    pauseIcon.classList.remove('hidden');
                    equalizer.classList.remove('opacity-0');
                }).catch(err => {
                    console.log("Esperando flujo de audio activo...", err);
                });
            } else {
                audioPlayer.pause();
                isPlaying = false;
                playIcon.classList.remove('hidden');
                pauseIcon.classList.add('hidden');
                equalizer.classList.add('opacity-0');
            }
        });

        // Control de volumen
        volumeSlider.addEventListener('input', (e) => {
            audioPlayer.volume = e.target.value;
        });
    </script>
</body>
</html>
